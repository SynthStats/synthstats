[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthstats"
version = "0.1.0"
description = "Training agents to write probabilistic programs with trajectory balance"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Younesse Kaddar"},
    {name = "Sam Staton"},
    {name = "Esmeralda S. Whitammer"},
    {name = "Zihuiwen Ye"},
    {name = "Jacek Karwowski"},
]
dependencies = [
    "httpx>=0.28.1",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.12.0",
    "tqdm>=4.67.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "torch>=2.1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ml = [
    "transformers>=5.6.1,<=5.16.1",
    "peft==0.18.1",
    "accelerate>=0.25.0",
    "litellm==1.106.6",
    "bitsandbytes>=0.43.1",
]
pymc = [
    "pymc>=5.10.0",
    "arviz>=0.17.0",
]
cluster = [
    "hydra-submitit-launcher>=1.2.0",
]
wandb = [
    "wandb>=0.16.0",
]
harbor = ["harbor>=0.24.0"]
api = ["openai>=1.0.0"]

skyrl = [
    "ray[default]; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "torch==2.13.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "skyrl[fsdp]; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "skyrl-gym; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "harbor>=0.24.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "flash-attn==2.8.3; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "causal-conv1d==1.6.2.post1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "flashinfer-jit-cache==0.6.18.post1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "flashinfer-cubin==0.6.18.post1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "vllm-router; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "torchvision==0.28.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-mermaid2-plugin>=1.1.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-jupyter>=0.24.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
override-dependencies = ["nixl-cu12; sys_platform == 'never'", "xgrammar==0.2.3", "tilelang==0.1.13; sys_platform == 'linux'", "apache-tvm-ffi==0.1.12; sys_platform == 'linux'", "torch==2.13.0; sys_platform == 'linux'", "torchvision==0.28.0; sys_platform == 'linux'", "nvidia-cutlass-dsl[cu13]==4.7.1; sys_platform == 'linux'", "quack-kernels[cu13]==0.6.5; sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl/"
explicit = true

[tool.uv.sources]
skyrl = { git = "https://github.com/NovaSky-AI/SkyRL.git", rev = "8adc1e53465e2766ac8e8f5ec652e633d17e2279" }
skyrl-gym = { git = "https://github.com/NovaSky-AI/SkyRL.git", rev = "8adc1e53465e2766ac8e8f5ec652e633d17e2279", subdirectory = "skyrl-gym" }
torch = { index = "pytorch-cu130", extra = "skyrl", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
flashinfer-jit-cache = { index = "flashinfer-cu130", marker = "sys_platform == 'linux'" }
flashinfer-cubin = { index = "flashinfer", marker = "sys_platform == 'linux'" }
vllm-router = { url = "https://github.com/SumanthRH/router/releases/download/0.1.14.post1/vllm_router-0.1.14.post1-cp38-abi3-manylinux_2_35_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

# flash-attn requires torch at build time but doesn't declare it
[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[project.scripts]
synthstats = "synthstats.cli:main"
synthstats-train = "synthstats.cli.train:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["synthstats*"]

[tool.setuptools.package-data]
"synthstats.configs" = ["**/*.yaml"]
"synthstats.integrations.harbor" = [
    "task_packages/**/*.md",
    "task_packages/**/*.toml",
    "task_packages/**/*.sh",
    "task_packages/**/*.yaml",
    "task_packages/**/Dockerfile",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "slow: marks tests as slow",
    "canary: opt-in integration tests (RUN_CANARY=1)",
    "integration: requires external services",
]

[dependency-groups]
dev = [
    "hypothesis>=6.148.9",
    "ipykernel>=6.30.0",
    "mypy>=1.14.0",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]
