name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run ruff
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Run mypy
        run: uv run mypy src/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev --extra pymc --extra harbor

      - name: Install execution sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  contracts:
    name: Pinned SDK Contracts
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev --extra pymc --extra harbor --extra skyrl

      - name: Build execution image for container contract check
        run: |
          docker build -t synthstats-harbor-e2e:dugongs \
            src/synthstats/integrations/harbor/task_packages/dugongs/environment

      - name: Run pinned SDK contract checks
        env:
          SYNTHSTATS_TEST_IMAGE: synthstats-harbor-e2e:dugongs
        run: uv run pytest checks/ -v --tb=short
