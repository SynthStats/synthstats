# Qwen3.5-4B HuggingFace Policy
#
# Production model with thinking enabled by default.
# 4B params, 262K context.

model_name: Qwen/Qwen3.5-4B
device: ${device}
dtype: bfloat16

generation:
  max_new_tokens: 300
  temperature: 0.7

training:
  require_grad_logp: false

lora: null
gradient_checkpointing: false
